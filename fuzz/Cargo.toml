[workspace]
resolver = "2"
members = ["harness", "targets/runtime", "targets/soak", "targets/ice-solver", "snapshot"]

# Release keeps the runtime's debug_asserts and overflow checks: they are oracles.
[profile.release]
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
incremental = true

# The runtime pulls git deps through several forks; these patches pin them to the same sources
# hydration-node uses (copied from runtime-fuzzer/Cargo.toml). Keep Cargo.lock pins aligned with
# ../../hydration-node/Cargo.lock (see ../AGENTS.md).
[patch."https://github.com/moonbeam-foundation/open-runtime-module-library"]
